<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matemáticas 2 · Notas Corte 1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Oxanium:wght@300;400;600;800&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg:        #05050a;
      --green:     #00ff88;
      --green-dim: #00cc6a;
      --orange:    #ff6b00;
      --orange-dim:#cc5500;
      --blue:      #00cfff;
      --blue-dim:  #009dbf;
      --purple:    #b06bff;
      --white:     #f0e8f8;
      --glow-g:    0 0 8px #00ff88, 0 0 20px #00ff8866;
      --glow-o:    0 0 8px #ff6b00, 0 0 20px #ff6b0066;
      --glow-b:    0 0 8px #00cfff, 0 0 20px #00cfff66;
      --glow-p:    0 0 8px #b06bff, 0 0 20px #b06bff66;
      --font-mono: 'Share Tech Mono', monospace;
      --font-main: 'Oxanium', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg); color: var(--white);
      font-family: var(--font-main); min-height: 100vh;
      overflow-x: hidden; cursor: none;
    }
    .cursor {
      position: fixed; top: 0; left: 0; width: 12px; height: 12px;
      background: var(--blue); border-radius: 50%; pointer-events: none;
      z-index: 9999; box-shadow: var(--glow-b);
      transition: transform 0.1s, background 0.2s; transform: translate(-50%, -50%);
    }
    .cursor-ring {
      position: fixed; top: 0; left: 0; width: 36px; height: 36px;
      border: 1px solid var(--blue); border-radius: 50%; pointer-events: none;
      z-index: 9998; opacity: 0.5; transform: translate(-50%, -50%);
      transition: transform 0.15s ease, width 0.2s, height 0.2s, border-color 0.2s;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px);
      pointer-events: none; z-index: 100;
    }
    .grid-bg {
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(0,207,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,207,255,0.03) 1px, transparent 1px);
      background-size: 48px 48px; pointer-events: none; z-index: 0;
    }
    .blob { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.10; pointer-events: none; z-index: 0; animation: drift 18s ease-in-out infinite alternate; }
    .blob-1 { width:500px; height:500px; background:var(--blue);   top:-120px; left:-120px; animation-duration:20s; }
    .blob-2 { width:400px; height:400px; background:var(--purple); bottom:-100px; right:-100px; animation-duration:26s; }
    .blob-3 { width:350px; height:350px; background:var(--orange); top:45%; left:55%; animation-duration:16s; }
    @keyframes drift { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(40px,30px) scale(1.08); } }
    main { position: relative; z-index: 1; }

    header { padding: 60px 24px 40px; text-align: center; }
    .badge {
      display: inline-block; font-family: var(--font-mono); font-size: 0.7rem;
      color: var(--blue); border: 1px solid var(--blue); padding: 4px 14px;
      letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 20px;
      box-shadow: var(--glow-b); animation: pulse-border 3s ease-in-out infinite;
    }
    @keyframes pulse-border { 0%,100% { box-shadow: var(--glow-b); } 50% { box-shadow: 0 0 16px #00cfff, 0 0 40px #00cfff44; } }
    h1 { font-size: clamp(1.6rem,5vw,3.6rem); font-weight: 800; line-height: 1.05; letter-spacing: -0.02em; text-transform: uppercase; }
    h1 .line-blue  { color: var(--blue);  text-shadow: var(--glow-b); }
    h1 .line-white { color: var(--white); }
    .subtitle { margin-top: 16px; font-family: var(--font-mono); font-size: 0.85rem; color: #6a8a9a; letter-spacing: 0.1em; }
    .subtitle span { color: var(--purple); text-shadow: var(--glow-p); }

    .divider { display: flex; align-items: center; gap: 16px; max-width: 700px; margin: 40px auto; padding: 0 24px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; }
    .divider::before { background: linear-gradient(90deg, transparent, var(--purple)); }
    .divider::after  { background: linear-gradient(90deg, var(--purple), transparent); }
    .divider-icon { width: 8px; height: 8px; background: var(--purple); transform: rotate(45deg); box-shadow: var(--glow-p); flex-shrink: 0; }

    #statusBar {
      max-width: 600px; margin: 0 auto 16px; padding: 0 24px;
      font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.12em;
      text-align: center; min-height: 20px;
    }
    #statusBar.loading { color: var(--blue); }
    #statusBar.ready   { color: var(--green-dim); }
    #statusBar.error   { color: var(--orange); }

    .search-section { max-width: 600px; margin: 0 auto 48px; padding: 0 24px; text-align: center; }
    .search-label { font-family: var(--font-mono); font-size: 0.75rem; color: var(--purple); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 12px; display: block; }
    .search-wrap { position: relative; display: flex; align-items: center; }
    .search-prompt { font-family: var(--font-mono); font-size: 1rem; color: var(--blue); padding: 0 0 0 18px; position: absolute; pointer-events: none; text-shadow: var(--glow-b); }
    #searchInput {
      width: 100%; background: rgba(0,207,255,0.04); border: 1px solid var(--blue);
      border-radius: 0; color: var(--blue); font-family: var(--font-mono);
      font-size: 1.1rem; padding: 14px 14px 14px 42px; outline: none;
      letter-spacing: 0.1em; box-shadow: inset 0 0 20px rgba(0,207,255,0.05), var(--glow-b);
      transition: box-shadow 0.3s, background 0.3s; caret-color: var(--blue);
    }
    #searchInput:focus { background: rgba(0,207,255,0.08); box-shadow: inset 0 0 30px rgba(0,207,255,0.1), 0 0 20px #00cfff66, 0 0 60px #00cfff22; }
    #searchInput::placeholder { color: #1a3a4a; }
    #searchInput:disabled { opacity: 0.4; cursor: not-allowed; }

    #result { max-width: 660px; margin: 0 auto 64px; padding: 0 24px; display: none; }
    #result.visible { display: block; animation: fadeUp 0.4s ease; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }

    .card { border: 1px solid #101a25; background: rgba(5,8,15,0.92); padding: 0; overflow: hidden; position: relative; }
    .card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background: linear-gradient(90deg, var(--blue), var(--purple), var(--orange)); }

    .card-header { padding: 24px 28px 20px; border-bottom: 1px solid #0d1a25; display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; }
    .student-name { font-size: 1.15rem; font-weight: 600; color: var(--white); letter-spacing: 0.05em; }
    .student-id { font-family: var(--font-mono); font-size: 0.8rem; color: var(--blue); margin-top: 4px; }
    .corte-badge { font-family: var(--font-mono); font-size: 0.7rem; color: var(--purple); border: 1px solid var(--purple); padding: 4px 12px; letter-spacing: 0.15em; box-shadow: var(--glow-p); }

    /* 2 bloques: Trabajos | Parcial */
    .scores-grid { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid #0d1a25; }
    .score-block { padding: 20px 22px; border-right: 1px solid #0d1a25; }
    .score-block:last-child { border-right: none; }
    .score-label { font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: #4a6a7a; margin-bottom: 8px; }
    .score-value { font-size: 2rem; font-weight: 800; line-height: 1; }
    .score-weight { font-family: var(--font-mono); font-size: 0.65rem; color: #3a5a6a; margin-top: 6px; }
    .col-blue   .score-value { color: var(--blue);   text-shadow: var(--glow-b); }
    .col-purple .score-value { color: var(--purple);  text-shadow: var(--glow-p); }
    .col-orange .score-value { color: var(--orange);  text-shadow: var(--glow-o); }

    .breakdown { padding: 20px 28px; border-bottom: 1px solid #0d1a25; }
    .breakdown-title { font-family: var(--font-mono); font-size: 0.65rem; color: #4a6a7a; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 14px; }
    .item-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid #0d1520; font-size: 0.88rem; }
    .item-row:last-child { border-bottom: none; }
    .item-name { color: #7a9aaa; }
    .item-val { font-family: var(--font-mono); font-size: 0.9rem; font-weight: 600; }
    .v-blue   { color: var(--blue); }
    .v-purple { color: var(--purple); }
    .v-orange { color: var(--orange); }
    .bar-wrap { width:80px; height:4px; background:#0d1520; margin-left:16px; flex-shrink:0; }
    .bar-fill { height:100%; transition: width 0.8s ease; }
    .bar-blue   { background:var(--blue);   box-shadow:var(--glow-b); }
    .bar-purple { background:var(--purple);  box-shadow:var(--glow-p); }
    .bar-orange { background:var(--orange);  box-shadow:var(--glow-o); }

    .finals { display: grid; grid-template-columns: 1fr 1fr; }
    .final-block { padding: 24px 28px; border-right: 1px solid #0d1a25; text-align: center; }
    .final-block:last-child { border-right: none; }
    .final-label { font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.2em; color: #4a6a7a; text-transform: uppercase; margin-bottom: 10px; }
    .final-big { font-size: 3rem; font-weight: 800; line-height: 1; }
    .final-sala .final-big { color: var(--green);  text-shadow: 0 0 12px #00ff88, 0 0 40px #00ff8866; }
    .final-def  .final-big { color: var(--blue);   text-shadow: 0 0 12px #00cfff, 0 0 40px #00cfff66; }
    .final-sub { font-family: var(--font-mono); font-size: 0.7rem; margin-top: 6px; }
    .final-sala .final-sub { color: var(--green-dim); }
    .final-def  .final-sub { color: var(--blue-dim); }

    .bono-strip { padding: 12px 28px; border-top: 1px solid #0d1a25; display: flex; justify-content: space-between; align-items: center; font-family: var(--font-mono); font-size: 0.75rem; color: #4a6a7a; background: rgba(176,107,255,0.03); flex-wrap: wrap; gap: 8px; }
    .bono-strip .bval { color: var(--purple); font-size: 0.9rem; font-weight: 600; }

    .not-found { text-align: center; padding: 40px 28px; font-family: var(--font-mono); color: var(--orange); }

    footer { text-align: center; padding: 32px 24px 48px; border-top: 1px solid #0d1520; font-family: var(--font-mono); font-size: 0.7rem; color: #1a3a4a; position: relative; z-index: 1; }
    footer span { color: #3a5a6a; }

    @media (max-width: 600px) {
      .scores-grid { grid-template-columns: 1fr; }
      .score-block { border-right: none; border-bottom: 1px solid #0d1a25; }
      .score-block:last-child { border-bottom: none; }
      .finals { grid-template-columns: 1fr; }
      .final-block { border-right: none; border-bottom: 1px solid #0d1a25; }
      .final-block:last-child { border-bottom: none; }
      .bono-strip { font-size: 0.68rem; }
    }
  </style>
</head>
<body>
<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>
<div class="grid-bg"></div>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<main>
  <header>
    <div class="badge">CORTE 1 · 2026-2</div>
    <h1>
      <span class="line-blue">Matemáticas 2</span><br>
      <span class="line-white">Cálculo Integral</span>
    </h1>
    <p class="subtitle">
      Grupo <span>2Q</span> &nbsp;·&nbsp;
      David Mauricio Valoyes Porras &nbsp;·&nbsp;
      Universidad El Bosque
    </p>
  </header>

  <div class="divider"><div class="divider-icon"></div></div>

  <div id="statusBar" class="loading">&gt;_ cargando planilla...</div>

  <section class="search-section">
    <span class="search-label">// consulta tu nota</span>
    <div class="search-wrap">
      <span class="search-prompt">&gt;_</span>
      <input
        type="text"
        id="searchInput"
        placeholder="Ingresa tu número de documento..."
        autocomplete="off"
        spellcheck="false"
        disabled
      />
    </div>
  </section>

  <div id="result"></div>
</main>

<footer>
  <span>Matemáticas 2 · Semestre 2026-2 · Grupo 2Q</span>
  &nbsp;·&nbsp; Universidad El Bosque
</footer>

<script>
function n(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'string' && (v.includes('#') || v.trim() === '')) return null;
  const p = parseFloat(v);
  return isNaN(p) ? null : p;
}
const fmt  = v => v !== null ? v.toFixed(2) : '—';
const fmt1 = v => v !== null ? v.toFixed(1) : '—';

function bar(val, max, cls) {
  const pct = val !== null ? Math.min(100, (val / max) * 100) : 0;
  return `<div class="bar-wrap"><div class="bar-fill ${cls}" style="width:${pct}%"></div></div>`;
}

function renderCard(s) {
  const bonos = s.bonos !== null && s.bonos > 0 ? '+' + s.bonos.toFixed(2) : '0.00';
  const falt  = s.falta === 'No aplica' ? 'No aplica'
              : s.falta !== null ? s.falta.toFixed(2) : '—';

  return `
  <div class="card">
    <div class="card-header">
      <div>
        <div class="student-name">${s.nombre}</div>
        <div class="student-id">ID: ${s.id}</div>
      </div>
      <div class="corte-badge">CORTE 1</div>
    </div>

    <!-- 2 bloques: Trabajos (×0.5) | Parcial (×0.5) -->
    <div class="scores-grid">
      <div class="score-block col-purple">
        <div class="score-label">Trabajos</div>
        <div class="score-value">${fmt(s.nt_pond)}</div>
        <div class="score-weight">Peso × 0.50</div>
      </div>
      <div class="score-block col-orange">
        <div class="score-label">Parcial</div>
        <div class="score-value">${fmt(s.parc_pond)}</div>
        <div class="score-weight">Peso × 0.50</div>
      </div>
    </div>

    <div class="breakdown">
      <div class="breakdown-title">// desglose de ítems</div>
      <div class="item-row">
        <span class="item-name">Taller 1</span>
        <div style="display:flex;align-items:center">
          <span class="item-val v-purple">${fmt(s.taller1)}</span>
          ${s.taller1!==null?bar(s.taller1,5,'bar-purple'):''}
        </div>
      </div>
      <div class="item-row">
        <span class="item-name">Taller 2</span>
        <div style="display:flex;align-items:center">
          <span class="item-val v-purple">${fmt(s.taller2)}</span>
          ${s.taller2!==null?bar(s.taller2,5,'bar-purple'):''}
        </div>
      </div>
      <div class="item-row">
        <span class="item-name">Parcial</span>
        <div style="display:flex;align-items:center">
          <span class="item-val v-orange">${fmt(s.parc)}</span>
          ${s.parc!==null?bar(s.parc,5,'bar-orange'):''}
        </div>
      </div>
    </div>

    <div class="finals">
      <div class="final-block final-def">
        <div class="final-label">// definitiva</div>
        <div class="final-big">${fmt(s.def)}</div>
        <div class="final-sub">nota calculada</div>
      </div>
      <div class="final-block final-sala">
        <div class="final-label">// nota a sala</div>
        <div class="final-big">${fmt1(s.sala)}</div>
        <div class="final-sub">sistema SALA</div>
      </div>
    </div>

    <div class="bono-strip">
      <span>Bonos: <span class="bval">${bonos}</span></span>
      <span>Para aprobar: <span class="bval">${falt}</span></span>
    </div>
  </div>`;
}

// Hoja "Corte 1" — índices base 0:
// A(0)=id, C(2)=nombre
// E(4)=taller1, F(5)=taller2
// G(6)=nt_pond (trabajos ×0.5), H(7)=parc, I(8)=parc_pond (parcial ×0.5)
// J(9)=actividad_bono, K(10)=bonos
// L(11)=def, M(12)=sala, N(13)=falta
const CI = {
  id:0, nombre:2,
  taller1:4, taller2:5,
  nt_pond:6, parc:7, parc_pond:8,
  bonos:10,
  def:11, sala:12, falta:13
};
const DATA_START_ROW = 7;

let DATA   = [];
let LOADED = false;

async function loadExcel() {
  const status = document.getElementById('statusBar');
  const input  = document.getElementById('searchInput');
  try {
    status.className = 'loading';
    status.textContent = '>_ conectando con la planilla...';

    const resp = await fetch('Corte_1.xlsx');
    if (!resp.ok) throw new Error(`No se encontró "Corte_1.xlsx" (HTTP ${resp.status})`);

    const buffer = await resp.arrayBuffer();
    const wb = XLSX.read(buffer, { type: 'array', cellText: false });

    const sheetName = wb.SheetNames.find(n => n.trim() === 'Corte 1');
    if (!sheetName) throw new Error(`Hoja "Corte 1" no encontrada. Disponibles: ${wb.SheetNames.join(', ')}`);

    const ws   = wb.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true });

    DATA = rows
      .slice(DATA_START_ROW)
      .filter(row => row[CI.id] !== null && row[CI.id] !== undefined && row[CI.id] !== '')
      .map(row => {
        const rawId  = String(row[CI.id]).replace(/\.0+$/, '').replace(/\xa0/g, '').trim();
        const nombre = String(row[CI.nombre] || '').replace(/\xa0/g, '').trim();

        let falta = null;
        const rawFalta = row[CI.falta];
        if (rawFalta !== null && rawFalta !== undefined && rawFalta !== '') {
          if (typeof rawFalta === 'string' && rawFalta.toLowerCase().includes('aplica')) {
            falta = 'No aplica';
          } else if (typeof rawFalta === 'string' && rawFalta.includes('#')) {
            falta = null;
          } else {
            falta = n(rawFalta);
          }
        }

        return {
          id:       rawId,
          nombre:   nombre,
          taller1:  n(row[CI.taller1]),
          taller2:  n(row[CI.taller2]),
          nt_pond:  n(row[CI.nt_pond]),
          parc:     n(row[CI.parc]),
          parc_pond:n(row[CI.parc_pond]),
          bonos:    n(row[CI.bonos]),
          def:      n(row[CI.def]),
          sala:     n(row[CI.sala]),
          falta:    falta,
        };
      })
      .filter(s => s.id);

    LOADED = true;
    status.className = 'ready';
    status.textContent = `>_ planilla lista · ${DATA.length} estudiantes`;
    input.disabled = false;
    input.focus();

  } catch (err) {
    status.className = 'error';
    status.textContent = `>_ ERROR: ${err.message}`;
    console.error(err);
  }
}

document.getElementById('searchInput').addEventListener('input', function() {
  if (!LOADED) return;
  const q      = this.value.trim().replace(/\D/g, '');
  const result = document.getElementById('result');
  if (!q || q.length < 4) { result.classList.remove('visible'); return; }

  const found = DATA.find(s => s.id === q || s.id.startsWith(q));
  result.classList.add('visible');

  if (found) {
    result.innerHTML = renderCard(found);
    setTimeout(() => {
      result.querySelectorAll('.bar-fill').forEach(b => {
        const w = b.style.width; b.style.width = '0';
        requestAnimationFrame(() => { b.style.width = w; });
      });
    }, 50);
  } else {
    result.innerHTML = `<div class="card"><div class="not-found">
      &gt;_ DOCUMENTO NO ENCONTRADO<br>
      <span style="color:#1a3a4a;font-size:0.8rem">Verifica tu número e intenta de nuevo</span>
    </div></div>`;
  }
});

const cursor = document.getElementById('cursor');
const ring   = document.getElementById('cursorRing');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; cursor.style.left=mx+'px'; cursor.style.top=my+'px'; });
function animRing() { rx+=(mx-rx)*0.12; ry+=(my-ry)*0.12; ring.style.left=rx+'px'; ring.style.top=ry+'px'; requestAnimationFrame(animRing); }
animRing();
document.querySelectorAll('a,button,input').forEach(el => {
  el.addEventListener('mouseenter', () => {
    cursor.style.transform='translate(-50%,-50%) scale(2)';
    ring.style.width='56px'; ring.style.height='56px';
    ring.style.borderColor='var(--purple)'; cursor.style.background='var(--purple)';
  });
  el.addEventListener('mouseleave', () => {
    cursor.style.transform='translate(-50%,-50%) scale(1)';
    ring.style.width='36px'; ring.style.height='36px';
    ring.style.borderColor='var(--blue)'; cursor.style.background='var(--blue)';
  });
});

loadExcel();
</script>
</body>
</html>
